    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

t-family:\"Figtree\";font-style:normal;font-weight:300 900;font-display:swap;src:url(\"3a997046-116a-40fd-82ae-835668d61651\") format(\"woff2-variations\");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}\n@font-face{font-family:\"Figtree\";font-style:italic;font-weight:300 900;font-display:swap;src:url(\"6eca5fb8-769e-4950-b88b-fe52b8ca654e\") format(\"woff2-variations\");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}\n\n/* Static fallbacks for engines without variable-font support. */\n@font-face{font-family:\"Figtree Static\";font-style:normal;font-weight:400;font-display:swap;src:url(\"d570e9c2-7801-4e55-874b-b7e6e15e6009\") format(\"woff2\")}\n@font-face{font-family:\"Figtree Static\";font-style:normal;font-weight:600;font-display:swap;src:url(\"5c257e9f-26d8-4324-967a-31dd18dd1fdd\") format(\"woff2\")}\n@font-face{font-family:\"Figtree Static\";font-style:normal;font-weight:700;font-display:swap;src:url(\"974a63d3-c3f3-48d9-b1ae-0046480c61d2\") format(\"woff2\")}\n@font-face{font-family:\"Figtree Static\";font-style:normal;font-weight:800;font-display:swap;src:url(\"7e20ae7c-d22d-4d55-b141-ddae0169677d\") format(\"woff2\")}\n<\u002Fstyle>\n<style>/* Michigan Virtual official palette — michiganvirtual.org/brand\n   Hex is canonical. Where the brand page's rgb() and hex disagree (Dark Teal), hex wins. */\n:root{\n  /* Teal ramp — the brand's spine, darkest to lightest */\n  --mv-black-teal:#091d20;   /* PMS: none · default body text */\n  --mv-deep-teal:#093c44;    /* PMS 309 C · primary headings, dark bands */\n  --mv-dark-teal:#115e6e;    /* PMS 315 C · secondary headings */\n  --mv-light-teal:#2f8d98;   /* PMS 7711 C · accents, 24px+ headings */\n  --mv-bright-teal:#c7dee0;  /* PMS: none · borders, table rules, row shading */\n  --mv-white-teal:#f3fafc;   /* PMS: none · light section background */\n\n  /* Accents — green is decoration only, orange is action only */\n  --mv-green:#b5cd34;        /* PMS 367 C · dividers + accents, NEVER text */\n  --mv-green-a11y:#6a7f17;   /* PMS 370 C · accessible green (4.53:1 on white) */\n  --mv-orange:#f7941e;       /* PMS 715 C · CTA fills */\n  --mv-orange-a11y:#a84c2a;  /* PMS 1675 C · CTA text/links, hover + focus */\n  --mv-pale-orange:#e4b782;  /* PMS: none · warm accent */\n  --mv-white-orange:#fff4e7; /* PMS: none · warm advisory background */\n\n  /* Neutrals */\n  --mv-dark-gray:#414042;    /* PMS Black 7 C · alternate body text */\n  --mv-light-gray:#6d6e71;   /* PMS Cool Gray 9 C · ancillary / footnotes */\n  --mv-white:#ffffff;\n\n  /* Alpha derivatives (for rules, scrims, hover washes on brand grounds) */\n  --mv-black-teal-08:rgb(9 29 32 / .08);\n  --mv-black-teal-12:rgb(9 29 32 / .12);\n  --mv-deep-teal-06:rgb(9 60 68 / .06);\n  --mv-white-16:rgb(255 255 255 / .16);\n  --mv-white-24:rgb(255 255 255 / .24);\n  --mv-orange-16:rgb(247 148 30 / .16);\n\n  /* Published contrast ratios against white (computed WCAG 2.x) */\n  --mv-contrast-black-teal:17.53; /* @kind other */\n  --mv-contrast-deep-teal:12.04; /* @kind other */\n  --mv-contrast-dark-teal:7.32; /* @kind other */\n  --mv-contrast-light-teal:3.94; /* @kind other */\n  --mv-contrast-orange:2.28; /* @kind other */\n  --mv-contrast-orange-a11y:5.65; /* @kind other */\n  --mv-contrast-green:1.79; /* @kind other */\n  --mv-contrast-green-a11y:4.53; /* @kind other */\n  --mv-contrast-light-gray:5.10; /* @kind other */\n  --mv-contrast-dark-gray:10.31; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Type. Figtree everywhere; IBM Plex Serif only for long-form research + blog prose.\n   Fallback order is prescribed by brand standards: Figtree → Roboto → Noto Sans → Helvetica → Aptos. */\n:root{\n  --mv-font-sans:\"Figtree\",\"Figtree Static\",Roboto,\"Noto Sans\",Helvetica,Aptos,system-ui,sans-serif;\n  --mv-font-serif:\"IBM Plex Serif\",Garamond,\"Noto Serif\",Times,serif;\n  --mv-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n\n  --mv-weight-light:300;\n  --mv-weight-regular:400;\n  --mv-weight-medium:500;\n  --mv-weight-semibold:600;\n  --mv-weight-bold:700;\n  --mv-weight-extrabold:800;\n  --mv-weight-black:900;\n\n  /* Scale — 1.25 major-third-ish, snapped to whole px. Body is 17px. */\n  --mv-text-3xs:11px;\n  --mv-text-2xs:12px;\n  --mv-text-xs:13px;\n  --mv-text-sm:15px;\n  --mv-text-base:17px;\n  --mv-text-lg:19px;\n  --mv-text-xl:22px;\n  --mv-text-2xl:26px;\n  --mv-text-3xl:32px;\n  --mv-text-4xl:40px;\n  --mv-text-5xl:52px;\n  --mv-text-6xl:64px;\n  --mv-text-7xl:80px;\n\n  --mv-leading-tight:1.1; /* @kind font */\n  --mv-leading-snug:1.25; /* @kind font */\n  --mv-leading-normal:1.45; /* @kind font */\n  --mv-leading-relaxed:1.65; /* @kind font */\n\n  --mv-tracking-tight:-0.02em; /* @kind font */\n  --mv-tracking-snug:-0.01em; /* @kind font */\n  --mv-tracking-normal:0; /* @kind font */\n  --mv-tracking-wide:0.04em; /* @kind font */\n  --mv-tracking-caps:0.09em; /* @kind font */  /* eyebrows / overlines, always uppercase */\n\n  --mv-measure-prose:68ch; /* @kind font */    /* max line length for body copy */\n  --mv-measure-lede:46ch; /* @kind font */\n}\n<\u002Fstyle>\n<style>/* Spacing — 4px base grid. Section rhythm is deliberately generous (96–128px). */\n:root{\n  --mv-space-0:0;\n  --mv-space-1:4px;\n  --mv-space-2:8px;\n  --mv-space-3:12px;\n  --mv-space-4:16px;\n  --mv-space-5:20px;\n  --mv-space-6:24px;\n  --mv-space-8:32px;\n  --mv-space-10:40px;\n  --mv-space-12:48px;\n  --mv-space-16:64px;\n  --mv-space-20:80px;\n  --mv-space-24:96px;\n  --mv-space-32:128px;\n\n  --mv-gutter:24px;           /* grid gap for card grids */\n  --mv-section-y:96px;        /* vertical padding of a page section */\n  --mv-section-y-tight:64px;\n  --mv-container:1240px;      /* max content width */\n  --mv-container-narrow:800px;/* prose / article column */\n  --mv-container-wide:1440px;\n  --mv-page-x:32px;           /* page side padding, desktop */\n  --mv-page-x-sm:20px;\n\n  --mv-tap-min:44px;          /* minimum interactive target */\n  --mv-field-h:48px;          /* form control height */\n  --mv-field-h-sm:38px;\n}\n<\u002Fstyle>\n<style>/* Radii, borders, shadows. Shadows are teal-tinted, never neutral black. */\n:root{\n  --mv-radius-xs:3px;\n  --mv-radius-sm:6px;\n  --mv-radius-md:10px;\n  --mv-radius-lg:16px;\n  --mv-radius-xl:24px;\n  --mv-radius-pill:999px;\n\n  --mv-border-hairline:1px;\n  --mv-border-thick:2px;\n  --mv-border-divider:4px;    /* the green section divider */\n  --mv-border-rule:var(--mv-border-hairline) solid var(--mv-bright-teal);\n\n  --mv-shadow-none:none;\n  --mv-shadow-xs:0 1px 2px rgb(9 29 32 / .06);\n  --mv-shadow-sm:0 1px 3px rgb(9 29 32 / .08),0 1px 2px rgb(9 29 32 / .04);\n  --mv-shadow-md:0 4px 12px rgb(9 29 32 / .10),0 1px 3px rgb(9 29 32 / .06);\n  --mv-shadow-lg:0 12px 28px rgb(9 29 32 / .13),0 2px 6px rgb(9 29 32 / .07);\n  --mv-shadow-xl:0 24px 56px rgb(9 29 32 / .18);\n  --mv-shadow-inset-top:inset 0 1px 0 rgb(255 255 255 / .12);\n\n  /* Focus is always the accessible orange, never the browser default */\n  --mv-focus-ring:0 0 0 3px rgb(168 76 42 / .38);\n  --mv-focus-ring-on-dark:0 0 0 3px rgb(255 255 255 / .55);\n  --mv-focus-outline:2px solid var(--mv-orange-a11y);\n  --mv-focus-offset:2px;\n}\n<\u002Fstyle>\n<style>/* Motion — restrained and short. Education audiences include screen-reader and\n   reduced-motion users; nothing bounces, nothing spins. */\n:root{\n  --mv-duration-instant:80ms;\n  --mv-duration-fast:140ms;\n  --mv-duration-base:200ms;\n  --mv-duration-slow:320ms;\n\n  --mv-ease-standard:cubic-bezier(.2,0,.2,1);\n  --mv-ease-out:cubic-bezier(0,0,.2,1);\n  --mv-ease-in-out:cubic-bezier(.4,0,.2,1);\n\n  --mv-transition-color:color var(--mv-duration-fast) var(--mv-ease-standard),background-color var(--mv-duration-fast) var(--mv-ease-standard),border-color var(--mv-duration-fast) var(--mv-ease-standard);\n  --mv-transition-lift:transform var(--mv-duration-base) var(--mv-ease-standard),box-shadow var(--mv-duration-base) var(--mv-ease-standard);\n\n  --mv-lift-hover:translateY(-2px); /* @kind other */\n  --mv-press-scale:.985; /* @kind other */\n}\n@media (prefers-reduced-motion:reduce){\n  :root{--mv-duration-instant:0ms;--mv-duration-fast:0ms;--mv-duration-base:0ms;--mv-duration-slow:0ms;--mv-lift-hover:none;--mv-press-scale:1}\n}\n<\u002Fstyle>\n<style>/* Semantic aliases — reach for these in product code, not the raw --mv-* palette.\n   Every mapping below is a rule from michiganvirtual.org/brand, not a preference. */\n:root{\n  /* Text */\n  --mv-text-body:var(--mv-black-teal);          /* default text on white / very light */\n  --mv-text-body-alt:var(--mv-dark-gray);\n  --mv-text-heading:var(--mv-deep-teal);        /* h1 */\n  --mv-text-heading-2:var(--mv-dark-teal);      /* h2 */\n  --mv-text-heading-3:var(--mv-light-teal);     /* h3+ only at 24px or larger */\n  --mv-text-muted:var(--mv-light-gray);         /* footnotes, captions, meta */\n  --mv-text-on-dark:var(--mv-white);\n  --mv-text-on-dark-muted:var(--mv-bright-teal);\n  --mv-text-inverse-heading:var(--mv-white);\n\n  /* Links + actions — orange is the CTA color; a11y orange on hover/focus */\n  --mv-link:var(--mv-orange-a11y);\n  --mv-link-hover:var(--mv-deep-teal);\n  --mv-link-on-dark:var(--mv-white);\n  --mv-link-on-dark-hover:var(--mv-green);\n  --mv-action-bg:var(--mv-orange);\n  --mv-action-bg-hover:var(--mv-orange-a11y);\n  --mv-action-fg:var(--mv-black-teal);          /* orange fill is 2.28:1 — never white text on it */\n  --mv-action-fg-hover:var(--mv-white);\n  --mv-action-secondary-bg:var(--mv-deep-teal);\n  --mv-action-secondary-fg:var(--mv-white);\n  --mv-action-secondary-bg-hover:var(--mv-black-teal);\n\n  /* Surfaces */\n  --mv-surface-page:var(--mv-white);\n  --mv-surface-alt:var(--mv-white-teal);        /* alternating page bands */\n  --mv-surface-card:var(--mv-white);\n  --mv-surface-sunken:var(--mv-white-teal);\n  --mv-surface-dark:var(--mv-deep-teal);        /* dark bands, footers, table headers */\n  --mv-surface-darkest:var(--mv-black-teal);\n  --mv-surface-warm:var(--mv-white-orange);     /* advisory callout */\n  --mv-surface-info:var(--mv-white-teal);       /* info callout */\n  --mv-surface-shade:var(--mv-bright-teal);     /* table row shading, chips */\n\n  /* Lines */\n  --mv-border-subtle:var(--mv-bright-teal);\n  --mv-border-strong:var(--mv-dark-teal);\n  --mv-border-on-dark:var(--mv-white-24);\n  --mv-accent-divider:var(--mv-green);          /* the signature 4px section rule */\n\n  /* Feedback (no separate red/amber/blue exists in the brand; teal + orange carry it) */\n  --mv-status-info-bg:var(--mv-white-teal);\n  --mv-status-info-accent:var(--mv-dark-teal);\n  --mv-status-success-bg:#f4f7e3;\n  --mv-status-success-accent:var(--mv-green-a11y);\n  --mv-status-attention-bg:var(--mv-white-orange);\n  --mv-status-attention-accent:var(--mv-orange-a11y);\n}\n<\u002Fstyle>\n<style>/* Element defaults + the handful of layout primitives every Michigan Virtual surface uses. */\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:var(--mv-font-sans);font-size:var(--mv-text-base);line-height:var(--mv-leading-relaxed);color:var(--mv-text-body);background:var(--mv-surface-page);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nh1,h2,h3,h4,h5,h6{margin:0 0 var(--mv-space-4);font-weight:var(--mv-weight-bold);line-height:var(--mv-leading-snug);letter-spacing:var(--mv-tracking-snug);text-wrap:balance}\nh1{font-size:var(--mv-text-5xl);font-weight:var(--mv-weight-extrabold);line-height:var(--mv-leading-tight);color:var(--mv-text-heading)}\nh2{font-size:var(--mv-text-3xl);color:var(--mv-text-heading-2)}\nh3{font-size:var(--mv-text-2xl);color:var(--mv-text-heading-2)}\nh4{font-size:var(--mv-text-xl);color:var(--mv-text-heading-2)}\nh5{font-size:var(--mv-text-lg);color:var(--mv-text-body)}\nh6{font-size:var(--mv-text-sm);color:var(--mv-text-muted);text-transform:uppercase;letter-spacing:var(--mv-tracking-caps)}\np{margin:0 0 var(--mv-space-5);text-wrap:pretty}\na{color:var(--mv-link);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;transition:var(--mv-transition-color)}\na:hover{color:var(--mv-link-hover);text-decoration-thickness:2px}\na:focus-visible{outline:var(--mv-focus-outline);outline-offset:var(--mv-focus-offset);border-radius:var(--mv-radius-xs)}\nstrong,b{font-weight:var(--mv-weight-bold)}\nsmall{font-size:var(--mv-text-xs);color:var(--mv-text-muted)}\nhr{height:var(--mv-border-divider);border:0;background:var(--mv-accent-divider);margin:var(--mv-space-12) 0}\nimg,svg,video{max-width:100%;height:auto;display:block}\nbutton,input,select,textarea{font:inherit;color:inherit}\n::selection{background:var(--mv-orange-16)}\nblockquote{margin:var(--mv-space-6) 0;padding-left:var(--mv-space-6);border-left:var(--mv-border-divider) solid var(--mv-accent-divider);font-size:var(--mv-text-lg);color:var(--mv-text-body)}\ncode,kbd,pre{font-family:var(--mv-font-mono);font-size:.92em}\n\n/* Layout primitives */\n.mv-container{width:100%;max-width:var(--mv-container);margin-inline:auto;padding-inline:var(--mv-page-x)}\n.mv-container--narrow{max-width:var(--mv-container-narrow)}\n.mv-section{padding-block:var(--mv-section-y)}\n.mv-section--alt{background:var(--mv-surface-alt)}\n.mv-section--dark{background:var(--mv-surface-dark);color:var(--mv-text-on-dark)}\n.mv-section--dark h1,.mv-section--dark h2,.mv-section--dark h3,.mv-section--dark h4{color:var(--mv-text-on-dark)}\n.mv-eyebrow{font-size:var(--mv-text-xs);font-weight:var(--mv-weight-bold);letter-spacing:var(--mv-tracking-caps);text-transform:uppercase;color:var(--mv-light-teal);margin:0 0 var(--mv-space-3)}\n.mv-divider{width:64px;height:var(--mv-border-divider);background:var(--mv-accent-divider);border-radius:var(--mv-radius-pill);border:0}\n.mv-divider--full{width:100%}\n.mv-prose{max-width:var(--mv-measure-prose)}\n.mv-prose--serif{font-family:var(--mv-font-serif);font-size:var(--mv-text-lg);line-height:var(--mv-leading-relaxed)}\n.mv-visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}\n<\u002Fstyle>\n<style>/* Michigan Virtual — global CSS entry point. Imports only. */\n/* Figtree — primary brand typeface. Variable (300–900), latin + latin-ext, upright + italic.\n   Files live in /assets/fonts (copied from the official Fontsource distribution of Figtree). */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1f4d63b8-9f7b-4296-a140-1fcfd9003e0e\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e7c64489-39c8-436b-9875-82972f125833\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7a424981-e800-43df-985f-882948a83bc3\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6b0414d5-dd0c-4a89-ac99-ad1ed33af454\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1 isplay:swap;src:url(\"1f8f862b-5fea-431e-997f-933c4cdb0fa1\") format(\"woff2-variations\");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}\n@font-face{font-family:\"Figtree\";font-style:normal;font-weight:300 900;font-display:swap;src:url(\"3a997046-116a-40fd-82ae-835668d61651\") format(\"woff2-variations\");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}\n@font-face{font-family:\"Figtree\";font-style:italic;font-weight:300 900;font-display:swap;src:url(\"6eca5fb8-769e-4950-b88b-fe52b8ca654e\") format(\"woff2-variations\");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}\n\n/* Static fallbacks for engines without variable-font support. */\n@font-face{font-family:\"Figtree Static\";font-style:normal;font-weight:400;font-display:swap;src:url(\"d570e9c2-7801-4e55-874b-b7e6e15e6009\") format(\"woff2\")}\n@font-face{font-family:\"Figtree Static\";font-style:normal;font-weight:600;font-display:swap;src:url(\"5c257e9f-26d8-4324-967a-31dd18dd1fdd\") format(\"woff2\")}\n@font-face{font-family:\"Figtree Static\";font-style:normal;font-weight:700;font-display:swap;src:url(\"974a63d3-c3f3-48d9-b1ae-0046480c61d2\") format(\"woff2\")}\n@font-face{font-family:\"Figtree Static\";font-style:normal;font-weight:800;font-display:swap;src:url(\"7e20ae7c-d22d-4d55-b141-ddae0169677d\") format(\"woff2\")}\n\n/* Michigan Virtual official palette — michiganvirtual.org/brand\n   Hex is canonical. Where the brand page's rgb() and hex disagree (Dark Teal), hex wins. */\n:root{\n  /* Teal ramp — the brand's spine, darkest to lightest */\n  --mv-black-teal:#091d20;   /* PMS: none · default body text */\n  --mv-deep-teal:#093c44;    /* PMS 309 C · primary headings, dark bands */\n  --mv-dark-teal:#115e6e;    /* PMS 315 C · secondary headings */\n  --mv-light-teal:#2f8d98;   /* PMS 7711 C · accents, 24px+ headings */\n  --mv-bright-teal:#c7dee0;  /* PMS: none · borders, table rules, row shading */\n  --mv-white-teal:#f3fafc;   /* PMS: none · light section background */\n\n  /* Accents — green is decoration only, orange is action only */\n  --mv-green:#b5cd34;        /* PMS 367 C · dividers + accents, NEVER text */\n  --mv-green-a11y:#6a7f17;   /* PMS 370 C · accessible green (4.53:1 on white) */\n  --mv-orange:#f7941e;       /* PMS 715 C · CTA fills */\n  --mv-orange-a11y:#a84c2a;  /* PMS 1675 C · CTA text/links, hover + focus */\n  --mv-pale-orange:#e4b782;  /* PMS: none · warm accent */\n  --mv-white-orange:#fff4e7; /* PMS: none · warm advisory background */\n\n  /* Neutrals */\n  --mv-dark-gray:#414042;    /* PMS Black 7 C · alternate body text */\n  --mv-light-gray:#6d6e71;   /* PMS Cool Gray 9 C · ancillary / footnotes */\n  --mv-white:#ffffff;\n\n  /* Alpha derivatives (for rules, scrims, hover washes on brand grounds) */\n  --mv-black-teal-08:rgb(9 29 32 / .08);\n  --mv-black-teal-12:rgb(9 29 32 / .12);\n  --mv-deep-teal-06:rgb(9 60 68 / .06);\n  --mv-white-16:rgb(255 255 255 / .16);\n  --mv-white-24:rgb(255 255 255 / .24);\n  --mv-orange-16:rgb(247 148 30 / .16);\n\n  /* Published contrast ratios against white (computed WCAG 2.x) */\n  --mv-contrast-black-teal:17.53; /* @kind other */\n  --mv-contrast-deep-teal:12.04; /* @kind other */\n  --mv-contrast-dark-teal:7.32; /* @kind other */\n  --mv-contrast-light-teal:3.94; /* @kind other */\n  --mv-contrast-orange:2.28; /* @kind other */\n  --mv-contrast-orange-a11y:5.65; /* @kind other */\n  --mv-contrast-green:1.79; /* @kind other */\n  --mv-contrast-green-a11y:4.53; /* @kind other */\n  --mv-contrast-light-gray:5.10; /* @kind other */\n  --mv-contrast-dark-gray:10.31; /* @kind other */\n}\n\n/* Type. Figtree everywhere; IBM Plex Serif only for long-form research + blog prose.\n   Fallback order is prescribed by brand standards: Figtree → Roboto → Noto Sans → Helvetica → Aptos. */\n:root{\n  --mv-font-sans:\"Figtree\",\"Figtree Static\",Roboto,\"Noto Sans\",Helvetica,Aptos,system-ui,sans-serif;\n  --mv-font-serif:\"IBM Plex Serif\",Garamond,\"Noto Serif\",Times,serif;\n  --mv-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n\n  --mv-weight-light:300;\n  --mv-weight-regular:400;\n  --mv-weight-medium:500;\n  --mv-weight-semibold:600;\n  --mv-weight-bold:700;\n  --mv-weight-extrabold:800;\n  --mv-weight-black:900;\n\n  /* Scale — 1.25 major-third-ish, snapped to whole px. Body is 17px. */\n  --mv-text-3xs:11px;\n  --mv-text-2xs:12px;\n  --mv-text-xs:13px;\n  --mv-text-sm:15px;\n  --mv-text-base:17px;\n  --mv-text-lg:19px;\n  --mv-text-xl:22px;\n  --mv-text-2xl:26px;\n  --mv-text-3xl:32px;\n  --mv-text-4xl:40px;\n  --mv-text-5xl:52px;\n  --mv-text-6xl:64px;\n  --mv-text-7xl:80px;\n\n  --mv-leading-tight:1.1; /* @kind font */\n  --mv-leading-snug:1.25; /* @kind font */\n  --mv-leading-normal:1.45; /* @kind font */\n  --mv-leading-relaxed:1.65; /* @kind font */\n\n  --mv-tracking-tight:-0.02em; /* @kind font */\n  --mv-tracking-snug:-0.01em; /* @kind font */\n  --mv-tracking-normal:0; /* @kind font */\n  --mv-tracking-wide:0.04em; /* @kind font */\n  --mv-tracking-caps:0.09em; /* @kind font */  /* eyebrows / overlines, always uppercase */\n\n  --mv-measure-prose:68ch; /* @kind font */    /* max line length for body copy */\n  --mv-measure-lede:46ch; /* @kind font */\n}\n\n/* Spacing — 4px base grid. Section rhythm is deliberately generous (96–128px). */\n:root{\n  --mv-space-0:0;\n  --mv-space-1:4px;\n  --mv-space-2:8px;\n  --mv-space-3:12px;\n  --mv-space-4:16px;\n  --mv-space-5:20px;\n  --mv-space-6:24px;\n  --mv-space-8:32px;\n  --mv-space-10:40px;\n  --mv-space-12:48px;\n  --mv-space-16:64px;\n  --mv-space-20:80px;\n  --mv-space-24:96px;\n  --mv-space-32:128px;\n\n  --mv-gutter:24px;           /* grid gap for card grids */\n  --mv-section-y:96px;        /* vertical padding of a page section */\n  --mv-section-y-tight:64px;\n  --mv-container:1240px;      /* max content width */\n  --mv-container-narrow:800px;/* prose / article column */\n  --mv-container-wide:1440px;\n  --mv-page-x:32px;           /* page side padding, desktop */\n  --mv-page-x-sm:20px;\n\n  --mv-tap-min:44px;          /* minimum interactive target */\n  --mv-field-h:48px;          /* form control height */\n  --mv-field-h-sm:38px;\n}\n\n/* Radii, borders, shadows. Shadows are teal-tinted, never neutral black. */\n:root{\n  --mv-radius-xs:3px;\n  --mv-radius-sm:6px;\n  --mv-radius-md:10px;\n  --mv-radius-lg:16px;\n  --mv-radius-xl:24px;\n  --mv-radius-pill:999px;\n\n  --mv-border-hairline:1px;\n  --mv-border-thick:2px;\n  --mv-border-divider:4px;    /* the green section divider */\n  --mv-border-rule:var(--mv-border-hairline) solid var(--mv-bright-teal);\n\n  --mv-shadow-none:none;\n  --mv-shadow-xs:0 1px 2px rgb(9 29 32 / .06);\n  --mv-shadow-sm:0 1px 3px rgb(9 29 32 / .08),0 1px 2px rgb(9 29 32 / .04);\n  --mv-shadow-md:0 4px 12px rgb(9 29 32 / .10),0 1px 3px rgb(9 29 32 / .06);\n  --mv-shadow-lg:0 12px 28px rgb(9 29 32 / .13),0 2px 6px rgb(9 29 32 / .07);\n  --mv-shadow-xl:0 24px 56px rgb(9 29 32 / .18);\n  --mv-shadow-inset-top:inset 0 1px 0 rgb(255 255 255 / .12);\n\n  /* Focus is always the accessible orange, never the browser default */\n  --mv-focus-ring:0 0 0 3px rgb(168 76 42 / .38);\n  --mv-focus-ring-on-dark:0 0 0 3px rgb(255 255 255 / .55);\n  --mv-focus-outline:2px solid var(--mv-orange-a11y);\n  --mv-focus-offset:2px;\n}\n\n/* Motion — restrained and short. Education audiences include screen-reader and\n   reduced-motion users; nothing bounces, nothing spins. */\n:root{\n  --mv-duration-instant:80ms;\n  --mv-duration-fast:140ms;\n  --mv-duration-base:200ms;\n  --mv-duration-slow:320ms;\n\n  --mv-ease-standard:cubic-bezi   --mv-action-secondary-fg:var(--mv-white);\n  --mv-action-secondary-bg-hover:var(--mv-black-teal);\n\n  /* Surfaces */\n  --mv-surface-page:var(--mv-white);\n  --mv-surface-alt:var(--mv-white-teal);        /* alternating page bands */\n  --mv-surface-card:var(--mv-white);\n  --mv-surface-sunken:var(--mv-white-teal);\n  --mv-surface-dark:var(--mv-deep-teal);        /* dark bands, footers, table headers */\n  --mv-surface-darkest:var(--mv-black-teal);\n  --mv-surface-warm:var(--mv-white-orange);     /* advisory callout */\n  --mv-surface-info:var(--mv-white-teal);       /* info callout */\n  --mv-surface-shade:var(--mv-bright-teal);     /* table row shading, chips */\n\n  /* Lines */\n  --mv-border-subtle:var(--mv-bright-teal);\n  --mv-border-strong:var(--mv-dark-teal);\n  --mv-border-on-dark:var(--mv-white-24);\n  --mv-accent-divider:var(--mv-green);          /* the signature 4px section rule */\n\n  /* Feedback (no separate red/amber/blue exists in the brand; teal + orange carry it) */\n  --mv-status-info-bg:var(--mv-white-teal);\n  --mv-status-info-accent:var(--mv-dark-teal);\n  --mv-status-success-bg:#f4f7e3;\n  --mv-status-success-accent:var(--mv-green-a11y);\n  --mv-status-attention-bg:var(--mv-white-orange);\n  --mv-status-attention-accent:var(--mv-orange-a11y);\n}\n\n/* Element defaults + the handful of layout primitives every Michigan Virtual surface uses. */\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:var(--mv-font-sans);font-size:var(--mv-text-base);line-height:var(--mv-leading-relaxed);color:var(--mv-text-body);background:var(--mv-surface-page);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nh1,h2,h3,h4,h5,h6{margin:0 0 var(--mv-space-4);font-weight:var(--mv-weight-bold);line-height:var(--mv-leading-snug);letter-spacing:var(--mv-tracking-snug);text-wrap:balance}\nh1{font-size:var(--mv-text-5xl);font-weight:var(--mv-weight-extrabold);line-height:var(--mv-leading-tight); );font-family:var(--mv-font-sans);box-shadow:0 0 0 1px rgb(9 29 32 / .07);--act-bg:{{ actBg }};--act-fg:{{ actFg }}\" data-act=\"{{ contrastKey }}\">\n\n  <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;overflow-y:auto;background:var(--mv-white)\">\n      <div style=\"padding:calc(env(safe-area-inset-top, 0px) + 30px) 22px 10px;display:flex;flex-direction:column;gap:18px\">\n        <img src=\"a51a2a0a-1c57-4924-85dc-1a7388993919\" alt=\"Michigan Virtual, Beyond the Summit: AI Implementers’ Symposium\" style=\"width:100%;max-width:280px;height:auto;align-self:flex-start\">\n        <div style=\"height:4px;width:64px;background:var(--mv-accent-divider);border-radius:2px\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <h1 style=\"margin:0;font-size:28px;line-height:1.1;letter-spacing:-.02em;font-weight:800;color:var(--mv-text-heading)\">Glad you’re here.<\u002Fh1>\n          <p style=\"margin:0;font-size:16px;line-height:1.55;color:var(--mv-text-body);max-width:34ch;text-wrap:pretty\">Two minutes of setup and the day is yours. Everything you type stays on this device — Michigan Virtual never sees it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:22px 22px 0;display:flex;flex-direction:column;gap:10px\">\n        <h2 style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Which symposium are you attending?<\u002Fh2>\n        <div role=\"radiogroup\" aria-label=\"Choose your symposium\" style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ regionOptions }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <button type=\"button\" role=\"radio\" aria-checked=\"{{ r.checked }}\" sc-camel-on-click=\"{{ r.pick }}\" style=\"min-height:64px;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:2px solid;cursor:pointer;background:var(--mv-white);border-color:{{ r.border }};background:{{ r.bg }}\">\n              <span aria-hidden=\"true\" style=\"width:22px;height:22px;border-radius:50%;border:2px solid var(--mv-dark-teal);flex:none;display:flex;align-items:center;justify-content:center\"><span style=\"width:11px;height:11px;border-radius:50%;background:{{ r.dot }}\"><\u002Fspan><\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <span style=\"font-weight:700;font-size:15px;color:var(--mv-text-heading)\">{{ r.region }}<\u002Fspan>\n                <span style=\"font-size:13px;color:var(--mv-text-body-alt)\">{{ r.line }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:22px 22px 0;display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Who are you?<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:5px\">\n          <label for=\"bts-name\" style=\"font-size:13px;font-weight:600;color:var(--mv-text-body)\">Your name<\u002Flabel>\n          <input id=\"bts-name\" type=\"text\" sc-camel-auto-complete=\"name\" value=\"{{ profileName }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"First and last name\" style=\"min-height:48px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 12px;font-size:16px;color:var(--mv-text-body);background:var(--mv-white)\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px\">\n          <label for=\"bts-district\" style=\"font-size:13px;font-weight:600;color:var(--mv-text-body)\">District or organization<\u002Flabel>\n          <input id=\"bts-district\" type=\"text\" sc-camel-auto-complete=\"organization\" value=\"{{ profileDistrict }}\" sc-camel-on-change=\"{{ onDistrict }}\" placeholder=\"e.g. Eaton Rapids Public Schools\" style=\"min-height:48px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 12px;font-size:16px;color:var(--mv-text-body);background:var(--mv-white)\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px\">\n          <label for=\"bts-role\" style=\"font-size:13px;font-weight:600;color:var(--mv-text-body)\">Your role <span style=\"font-weight:400;color:var(--mv-text-muted)\">(optional)<\u002Fspan><\u002Flabel>\n          <input id=\"bts-role\" type=\"text\" sc-camel-auto-complete=\"organization-title\" value=\"{{ profileRole }}\" sc-camel-on-change=\"{{ onRole }}\" placeholder=\"e.g. Director of Curriculum\" style=\"min-height:48px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 12px;font-size:16px;color:var(--mv-text-body);background:var(--mv-white)\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:24px 22px 40px;display:flex;flex-direction:column;gap:12px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ startApp }}\" style=\"min-height:52px;border-radius:9999px;border:none;cursor:pointer;font-size:16px;font-weight:700;background:var(--act-bg,var(--mv-orange));color:var(--act-fg,var(--mv-black-teal))\" style-hover=\"background:var(--mv-orange-a11y);color:var(--mv-white)\">Enter the symposium<\u002Fbutton>\n        <p style=\"margin:0;font-size:12px;line-height:1.5;color:var(--mv-text-muted);text-align:center\">You can change any of this later under Info.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ true }}\">\n  <a class=\"btsskip\" href=\"#bts-main\">Skip to content<\u002Fa>\n\n  <header style=\"background:var(--mv-surface-dark);padding:calc(env(safe-area-inset-top, 0px) + 16px) 18px 13px;flex:none;position:relative;z-index:5\">\n    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n      <div style=\"display:flex;flex-direction:column;gap:3px;min-width:0\">\n        <span style=\"font-weight:700;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--mv-text-on-dark-muted)\">Beyond the Summit · {{ eventShort }}<\u002Fspan>\n        <h1 style=\"margin:0;font-size:21px;line-height:1.15;letter-spacing:-.02em;font-weight:800;color:var(--mv-text-on-dark)\">{{ screenTitle }}<\u002Fh1>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ goProfile }}\" aria-label=\"Your details and settings\" style=\"flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--mv-border-on-dark);background:rgb(255 255 255 / .1);color:var(--mv-white);font-weight:800;font-size:14px;cursor:pointer\" style-hover=\"background:rgb(255 255 255 / .22)\">{{ initials }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <div style=\"height:4px;background:var(--mv-accent-divider);flex:none\"><\u002Fdiv>\n\n  <main id=\"bts-main\" tabindex=\"-1\" style=\"flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 18px\">\n\n    <!-- ───────── MY DAY ───────── -->\n    <sc-if value=\"{{ tabDay }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:18px 18px 0;display:flex;flex-direction:column;gap:14px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <h2 style=\"margin:0;font-size:25px;line-height:1.15;letter-spacing:-.02em;font-weight:800;color:var(--mv-text-heading)\">{{ greeting }}<\u002Fh2>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--mv-text-body-alt);text-wrap:pretty\">{{ greetingSub }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div aria-live=\"polite\" style=\"background:var(--mv-surface-dark);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgb(9 29 32 / .14);display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"width:8px;height:8px;border-radius:50%;background:var(--mv-green);flex:n le=\"font-size:12px;color:var(--mv-text-muted)\">{{ pickedCount }} of 3 chosen<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ planBlocks }}\" as=\"b\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;background:var(--mv-surface-sunken);border-bottom:1px solid var(--mv-border-subtle)\">\n            <span style=\"font-size:13px;font-weight:700;color:var(--mv-text-heading)\">Block {{ b.n }}<\u002Fspan>\n            <span style=\"font-size:12px;color:var(--mv-text-body-alt)\">{{ b.time }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ b.hasLab }}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ b.open }}\" style=\"width:100%;text-align:left;border:none;background:var(--mv-white);cursor:pointer;padding:14px;display:flex;gap:11px;align-items:flex-start\" style-hover=\"background:var(--mv-surface-sunken)\">\n              <span style=\"flex:none;min-width:34px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mv-white);letter-spacing:.02em;background:{{ b.color }}\">{{ b.labId }}<\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:3px;min-width:0;flex:1\">\n                <span style=\"font-size:15px;line-height:1.3;font-weight:700;color:var(--mv-text-heading);text-wrap:pretty\">{{ b.labTitle }}<\u002Fspan>\n                <span style=\"font-size:12.5px;line-height:1.4;color:var(--mv-text-body-alt)\">{{ b.labMeta }}<\u002Fspan>\n                <span style=\"font-size:12px;color:var(--mv-text-muted)\">{{ b.labRoom }}<\u002Fspan>\n              <\u002Fspan>\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--mv-light-teal)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex:none;margin-top:4px\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.empty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:14px;display:flex;flex-direction:column;gap:10px\">\n              <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--mv-text-body-alt)\">No lab picked yet. All four domains run in this block.<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ b.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"min-height:44px;border-radius:9999px;border:1px solid var(--mv-border-subtle);background:var(--mv-white);cursor:pointer;padding:0 13px;display:flex;align-items:center;gap:7px\" style-hover=\"border-color:var(--mv-border-strong);background:var(--mv-surface-sunken)\">\n                    <span style=\"width:7px;height:7px;border-radius:50%;flex:none;background:{{ o.color }}\"><\u002Fspan>\n                    <span style=\"font-size:13px;font-weight:700;color:var(--mv-text-heading)\">{{ o.id }}<\u002Fspan>\n                    <span style=\"font-size:13px;color:var(--mv-text-body-alt)\">{{ o.domainName }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <h3 style=\"margin:8px 0 0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Everyone together<\u002Fh3>\n      <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);overflow:hidden\">\n        <sc-for list=\"{{ plenaryItems }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"padding:13px 14px;border-bottom:1px solid var(--mv-border-subtle);display:flex;gap:12px;align-items:flex-start\">\n            <span style=\"flex:none;width:78px;font-size:12px;font-weight:700;color:var(--mv-dark-teal);padding-top:1px\">{{ p.time }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n              <span style=\"font-size:14.5px;font-weight:700;color:var(--mv-text-heading)\">{{ p.title }}<\u002Fspan>\n              <span style=\"font-size:12.5px;line-height:1.45;color:var(--mv-text-body-alt);text-wrap:pretty\">{{ p.detail }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--mv-surface-warm);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:7px;border-left:4px solid var(--mv-orange-a11y);margin-top:4px\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-orange-a11y)\">Before you leave<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--mv-text-body);text-wrap:pretty\">Your team commits to a 30/60/90 plan in the closing session. Start it early — the Notebook tab keeps it with you.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ goCommit }}\" style=\"align-self:flex-start;min-height:44px;border-radius:9999px;border:none;cursor:pointer;padding:0 18px;font-size:14px;font-weight:700;background:var(--act-bg,var(--mv-orange));color:var(--act-fg,var(--mv-black-teal))\" style-hover=\"background:var(--mv-orange-a11y);color:var(--mv-white)\">Open 30/60/90<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ───────── SCHEDULE ───────── -->\n    <sc-if value=\"{{ tabSchedule }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:16px 18px 0;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--mv-surface-card);border-radius:12px;padding:10px 13px;box-shadow:0 2px 6px rgb(9 29 32 / .08)\">\n        <span style=\"display:flex;flex-direction:column;gap:1px\">\n          <span style=\"font-size:14px;font-weight:700;color:var(--mv-text-heading)\">{{ eventDate }}<\u002Fspan>\n          <span style=\"font-size:12.5px;color:var(--mv-text-body-alt)\">8:30 a.m. – 4:00 p.m. · lunch provided<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ scheduleRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex;gap:11px;align-items:stretch\">\n          <div style=\"flex:none;width:72px;display:flex;flex-direction:column;gap:3px;padding-top:12px\">\n            <span style=\"font-size:12.5px;font-weight:700;color:var(--mv-dark-teal);line-height:1.25\">{{ row.time }}<\u002Fspan>\n            <span style=\"font-size:11px;color:var(--mv-text-muted)\">{{ row.mins }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;border-left:2px solid var(--mv-border-subtle);padding:0 0 12px 12px;position:relative\">\n            <span aria-hidden=\"true\" style=\"position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--mv-white);background:{{ row.dot }}\"><\u002Fspan>\n\n            <sc-if value=\"{{ row.plain }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:var(--mv-surface-card);border-radius:12px;padding:12px 14px;box-shadow:0 2px 6px rgb(9 29 32 / .07);display:flex;flex-direction:column;gap:4px\">\n                <span style=\"font-size:15px;font-weight:700;color:var(--mv-text-heading);text-wrap:pretty\">{{ row.title }}<\u002Fspan>\n                <span style=\"font-size:13px;line-height:1.5;color:var(--mv-text-body-alt);text-wrap:pretty\">{{ row.detail }}<\u002Fspan>\n                <sc-if value=\"{{ row.hasSteps }}\" hint-placeholder-val=\"{{ false }}\">\n                  <ul style=\"margin:6px 0 0;padding:0 0 0 16px;display:flex;flex-direction:column;gap:4px\">\n                    <sc-for list=\"{{ row.steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n                      <li style=\"font-size:12.5px;line-height:1.45;color:var(--mv-text-body-alt)\">{{ s }}<\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ row.isBlock }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:var(--mv-surface-card);border-radius:12px;box-shadow:0 2px 6px rgb(9 29 32 / .07);overflow:hidden\">\n                <div style=\"padding:11px 14px 9px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--mv-border-subtle)\">\n                  <span style=\"font-size:15px;font-weight:700;color:var(--mv-text-heading)\">{{ row.title }}<\u002Fspan>\n                  <span style=\"font-size:12.5px;color:var(--mv-text-body-alt)\">Pick one. Every domain runs in every block.<\u002Fspan>\n                <\u002Fdiv>\n                <div role=\"radiogroup\" aria-label=\"{{ row.title }} lab choice\">\n                  <sc-for list=\"{{ row.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;align-items:stretch;border-bottom:1px solid var(--mv-border-subtle);background:{{ o.rowBg }}\">\n                      <button type=\"button\" role=\"radio\" aria-checked=\"{{ o.checked }}\" sc-camel-on-click=\"{{ o.pick }}\" style=\"flex:1;min-width:0;min-height:58px;text-align:left;border:none;background:transparent;cursor:pointer;padding:11px 4px 11px 14px;display:flex;gap:10px;align-items:flex-start\">\n                        <span aria-hidden=\"true\" style=\"flex:none;margin-top:1px;width:20px;height:20px;border-radius:50%;border:2px solid var(--mv-dark-teal);display:flex;align-items:center;justify-content:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ o.dot }}\"><\u002Fspan><\u002Fspan>\n                        <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"font-size:11px;font-weight:800;padding:2px 5px;border-radius:4px;color:var(--mv-white);background:{{ o.color }}\">{{ o.id }}<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mv-text-muted)\">{{ o.domainName }}<\u002Fspan><\u002Fspan>\n                          <span style=\"font-size:14px;line-height:1.3;font-weight:700;color:var(--mv-text-heading);text-wrap:pretty\">{{ o.title }}<\u002Fspan>\n                          <span style=\"font-size:12px;color:var(--mv-text-body-alt)\">{{ o.lead }}<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fbutton>\n                      <button type=\"button\" sc-camel-on-click=\"{{ o.open }}\" aria-label=\"{{ o.moreLabel }}\" style=\"flex:none;width:46px;border:none;border-left:1px solid var(--mv-border-subtle);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--mv-surface-sunken)\">\n                        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--mv-light-teal)\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-5\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ───────── LABS ───────── -->\n    <sc-if value=\"{{ tabLabs }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:16px 0 0;display:flex;flex-direction:column;gap:13px\">\n      <p style=\"margin:0;padding:0 18px;font-size:14px;line-height:1.55;color:var(--mv-text-body-alt);text-wrap:pretty\">Labs are working sessions, not presentations. You build something, with help from the room.<\u002Fp>\n\n      <div role=\"tablist\" aria-label=\"Filter labs by domain\" style=\"display:flex;gap:7px;overflow-x:auto;padding:2px 18px 4px;scrollbar-width:none\">\n        <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <button type=\"button\" role=\"tab\" aria-selected=\"{{ f.on }}\" sc-camel-on-click=\"{{ f.pick }}\" style=\"flex:none;min-height:44px;border-radius:9999px;cursor:pointer;padding:0 15px;font-size:13.5px;font-weight:700;border:1px solid;border-color:{{ f.border }};background:{{ f.bg }};color:{{ f.fg }}\">{{ f.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"padding:0 18px;display:flex;flex-direction:column;gap:11px\">\n        <sc-for list=\"{{ labList }}\" as=\"l\" hint-placeholder-count=\"12\">\n          <button type=\"button\" sc-camel-on-click=\"{{ l.open }}\" style=\"text-align:left;background:var(--mv-surface-card);border:none;border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column\" style-hover=\"box-shadow:0 6px 16px rgb(9 29 32 / .14)\">\n            <span style=\"height:4px;width:100%;display:block;background:{{ l.color }}\"><\u002Fspan>\n            <span style=\"padding:13px 14px;display:flex;flex-direction:column;gap:6px\">\n              <span style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n                <span style=\"font-size:11px;font-weight:800;padding:3px 6px;border-radius:4px;color:var(--mv-white);background:{{ l.color }}\">{{ l.id }}<\u002Fspan>\n                <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mv-text-muted)\">{{ l.domainName }}<\u002Fspan>\n                <sc-if value=\"{{ l.inPlan }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:11px;font-weight:700;padding:3px 7px;border-radius:9999px;background:#f4f7e3;color:var(--mv-green-a11y)\">In your plan<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"font-size:16px;line-height:1.25;font-weight:700;letter-spacing:-.01em;color:var(--mv-text-heading);text-wrap:pretty\">{{ l.title }}<\u002Fspan>\n              <span style=\"font-size:13px;line-height:1.5;color:var(--mv-text-body-alt);text-wrap:pretty\">{{ l.teaser }}<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:2px\">\n                <span style=\"font-size:12px;font-weight:600;color:var(--mv-dark-teal)\">{{ l.blockLabel }}<\u002Fspan>\n                <span aria-hidden=\"true\" style=\"width:3px;height:3px;border-radius:50%;background:var(--mv-border-subtle)\"><\u002Fspan>\n                <span style=\"font-size:12px;color:var(--mv-text-muted)\">{{ l.lead }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ───────── NOTEBOOK ───────── -->\n    <sc-if value=\"{{ tabNotebook }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:16px 18px 0;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:var(--mv-surface-card);border-radius:16px;padding:15px;box-shadow:0 2px 6px rgb(9 29 32 / .08);display:flex;flex-direction:column;gap:9px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Mapping the Summit<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--mv-text-body);text-wrap:pretty\">The paper notebook on your table holds the wall map, panel synthesis and team coverage grid. This is the part you’ll want in your pocket: lab notes and your 30/60/90.<\u002Fp>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ exportNotes }}\" style=\"min-height:44px;border-radius:9999px;border:none;cursor:pointer;padding:0 16px;font-size:13.5px;font-weight:700;background:var(--act-bg,var(--mv-orange));color:var(--act-fg,var(--mv-black-teal))\" style-hover=\"background:var(--mv-orange-a11y);color:var(--mv-white)\">Export my notes<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goCommit }}\" style=\"min-height:44px;border-radius:9999px;cursor:pointer;padding:0 16px;font-size:13.5px;font-weight:700;border:2px solid var(--mv-border-strong);background:var(--mv-white);color:var(--mv-text-heading)\" style-hover=\"background:var(--mv-surface-sunken)\">Jump to 30/60/90<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;line-height:1.5;color:var(--mv-text-muted)\">Saved on this device only. Nothing is sent to Michigan Virtual.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3 style=\"margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Lab notes<\u002Fh3>\n\n      <sc-for list=\"{{ noteCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);overflow:hidden\">\n          <div style=\"padding:12px 14px;border-bottom:1px solid var(--mv-border-subtle);display:flex;flex-direction:column;gap:3px;background:{{ c.headBg }}\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mv-text-muted)\">Block {{ c.n }} · {{ c.time }}<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.25;font-weight:700;color:var(--mv-text-heading);text-wrap:pretty\">{{ c.title }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ c.hasLab }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:13px 14px;display:flex;flex-direction:column;gap:13px\">\n              <p style=\"margin:0;font-size:12px;line-height:1.5;color:var(--mv-text-muted)\">Consume → Construct → Communicate<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label for=\"{{ c.idConsume }}\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">Consume — what did you review?<\u002Flabel>\n                <textarea id=\"{{ c.idConsume }}\" rows=\"2\" value=\"{{ c.consume }}\" sc-camel-on-change=\"{{ c.onConsume }}\" placeholder=\"Tools, data, models, exemplars…\" style=\"border-radius:6px;border:1px solid var(--mv-border-subtle);padding:9px 11px;font-size:14px;line-height:1.5;color:var(--mv-text-body);background:var(--mv-white)\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label for=\"{{ c.idConstruct }}\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">Construct — what did you build or solve?<\u002Flabel>\n                <textarea id=\"{{ c.idConstruct }}\" rows=\"2\" value=\"{{ c.construct }}\" sc-camel-on-change=\"{{ c.onConstruct }}\" placeholder=\"The thing you made in the room…\" style=\"border-radius:6px;border:1px solid var(--mv-border-subtle);padding:9px 11px;font-size:14px;line-height:1.5;color:var(--mv-text-body);background:var(--mv-white)\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label for=\"{{ c.idCommunicate }}\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">Communicate — what will you tell your team?<\u002Flabel>\n                <textarea id=\"{{ c.idCommunicate }}\" rows=\"2\" value=\"{{ c.communicate }}\" sc-camel-on-change=\"{{ c.onCommunicate }}\" placeholder=\"The one move worth repeating…\" style=\"border-radius:6px;border:1px solid var(--mv-border-subtle);padding:9px 11px;font-size:14px;line-height:1.5;color:var(--mv-text-body);background:var(--mv-white)\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px;background:var(--mv-surface-sunken);border-radius:10px;padding:11px\">\n                <label for=\"{{ c.idMove }}\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">Key move or artifact I’m bringing back<\u002Flabel>\n                <input id=\"{{ c.idMove }}\" type=\"text\" value=\"{{ c.keyMove }}\" sc-camel-on-change=\"{{ c.onMove }}\" placeholder=\"One sentence\" style=\"min-height:44px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 11px;font-size:14px;color:var(--mv-text-body);background:var(--mv-white)\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ c.empty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:14px;display:flex;flex-direction:column;gap:10px\">\n              <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--mv-text-body-alt)\">Pick a lab for this block and your note fields appear here.<\u002Fp>\n              <button type=\"button\" sc-camel-on-click=\"{{ c.goPick }}\" style=\"align-self:flex-start;min-height:44px;border-radius:9999px;cursor:pointer;padding:0 16px;font-size:13.5px;font-weight:700;border:2px solid var(--mv-border-strong);background:var(--mv-white);color:var(--mv-text-heading)\" style-hover=\"background:var(--mv-surface-sunken)\">Choose a lab<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <h3 style=\"margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Thoughts and reflections<\u002Fh3>\n      <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);padding:14px;display:flex;flex-direction:column;gap:7px\">\n        <label for=\"bts-reflection\" style=\"font-size:13px;line-height:1.5;color:var(--mv-text-body-alt)\">Anything you want to remember — a name, a disagreement, a question you didn’t get to ask.<\u002Flabel>\n        <textarea id=\"bts-reflection\" rows=\"5\" value=\"{{ reflection }}\" sc-camel-on-change=\"{{ onReflection }}\" placeholder=\"Start typing…\" style=\"border-radius:6px;border:1px solid var(--mv-border-subtle);padding:10px 11px;font-size:14px;line-height:1.55;color:var(--mv-text-body);background:var(--mv-white)\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <h3 id=\"bts-commit\" style=\"margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">30 / 60 / 90 commitments<\u002Fh3>\n      <sc-for list=\"{{ commitCards }}\" as=\"k\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);overflow:hidden\">\n          <div style=\"padding:12px 14px;background:var(--mv-surface-dark);display:flex;flex-direction:column;gap:2px\">\n            <span style=\"font-size:17px;font-weight:800;color:var(--mv-text-on-dark)\">{{ k.label }}<\u002Fspan>\n            <span style=\"font-size:12.5px;color:var(--mv-text-on-dark-muted)\">{{ k.sub }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:13px 14px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <label for=\"{{ k.idAction }}\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">{{ k.actionLabel }}<\u002Flabel>\n              <textarea id=\"{{ k.idAction }}\" rows=\"2\" value=\"{{ k.action }}\" sc-camel-on-change=\"{{ k.onAction }}\" placeholder=\"{{ k.actionHint }}\" style=\"border-radius:6px;border:1px solid var(--mv-border-subtle);padding:9px 11px;font-size:14px;line-height:1.5;color:var(--mv-text-body);background:var(--mv-white)\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <label for=\"{{ k.idEvidence }}\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">{{ k.evidenceLabel }}<\u002Flabel>\n              <textarea id=\"{{ k.idEvidence }}\" rows=\"2\" value=\"{{ k.evidence }}\" sc-camel-on-change=\"{{ k.onEvidence }}\" placeholder=\"{{ k.evidenceHint }}\" style=\"border-radius:6px;border:1px solid var(--mv-border-subtle);padding:9px 11px;font-size:14px;line-height:1.5;color:var(--mv-text-body);background:var(--mv-white)\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px\">\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label for=\"{{ k.idLead }}\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">Who leads<\u002Flabel>\n                <input id=\"{{ k.idLead }}\" type=\"text\" value=\"{{ k.lead }}\" sc-camel-on-change=\"{{ k.onLead }}\" placeholder=\"Name\" style=\"min-height:44px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 11px;font-size:14px;color:var(--mv-text-body);background:var(--mv-white)\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label for=\"{{ k.idDate }}\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">Reconvene<\u002Flabel>\n                <input id=\"{{ k.idDate }}\" type=\"date\" value=\"{{ k.date }}\" sc-camel-on-change=\"{{ k.onDate }}\" style=\"min-height:44px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 11px;font-size:14px;color:var(--mv-text-body);background:var(--mv-white)\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ───────── INFO ───────── -->\n    <sc-if value=\"{{ tabInfo }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:16px 18px 0;display:flex;flex-direction:column;gap:14px\">\n\n      <div id=\"bts-venue\" style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);overflow:hidden\">\n        <div style=\"height:4px;background:var(--mv-accent-divider)\"><\u002Fdiv>\n        <div style=\"padding:15px;display:flex;flex-direction:column;gap:11px\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">{{ eventRegion }}<\u002Fspan>\n          <span style=\"font-size:19px;line-height:1.2;font-weight:800;letter-spacing:-.01em;color:var(--mv-text-heading)\">{{ eventVenue }}<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.5;color:var(--mv-text-body-alt)\">{{ eventDate }} · {{ eventCity }}<\u002Fspan>\n          <div style=\"height:1px;background:var(--mv-border-subtle)\"><\u002Fdiv>\n          <sc-for list=\"{{ venueFacts }}\" as=\"v\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:10px;align-items:baseline\">\n              <span style=\"flex:none;width:84px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mv-text-muted)\">{{ v.k }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.5;color:var(--mv-text-body);text-wrap:pretty\">{{ v.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button type=\"button\" sc-camel-on-click=\"{{ switchRegion }}\" style=\"align-self:flex-start;min-height:44px;border-radius:9999px;cursor:pointer;padding:0 16px;font-size:13.5px;font-weight:700;border:2px solid var(--mv-border-strong);background:var(--mv-white);color:var(--mv-text-heading)\" style-hover=\"background:var(--mv-surface-sunken)\">Switch symposium<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"bts-wifi\" style=\"background:var(--mv-surface-dark);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 14px rgb(9 29 32 / .14)\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--mv-green)\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12.55a11 11 0 0 1 14.08 0\"><\u002Fpath><path d=\"M1.42 9a16 16 0 0 1 21.16 0\"><\u002Fpath><path d=\"M8.53 16.11a6 6 0 0 1 6.95 0\"><\u002Fpath><path d=\"M12 20h.01\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-text-on-dark-muted)\">Guest WiFi<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <span style=\"font-size:12px;color:var(--mv-text-on-dark-muted)\">Network<\u002Fspan>\n            <span style=\"font-family:var(--mv-font-mono);font-size:17px;font-weight:700;color:var(--mv-text-on-dark)\">{{ wifiNetwork }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <span style=\"font-size:12px;color:var(--mv-text-on-dark-muted)\">Password<\u002Fspan>\n            <span style=\"font-family:var(--mv-font-mono);font-size:17px;font-weight:700;color:var(--mv-text-on-dark)\">{{ wifiPassword }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:var(--mv-text-on-dark-muted);text-wrap:pretty\">Credentials are confirmed with the venue the week of the event and appear here automatically.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);padding:15px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Why we’re here<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--mv-text-body);text-wrap:pretty\">The smartest person in the room is the room. Today moves your district along the arc from AI 101 to 201 to 301 — literacy, to implementation, to real classroom and operational innovation.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-top:2px\">\n          <span style=\"font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9999px;background:var(--mv-surface-shade);color:var(--mv-deep-teal)\">AI 101 Literacy<\u002Fspan>\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--mv-light-teal)\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9999px;background:var(--mv-surface-shade);color:var(--mv-deep-teal)\">201 Implementation<\u002Fspan>\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--mv-light-teal)\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9999px;background:var(--mv-deep-teal);color:var(--mv-white)\">301 Innovation<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">The four domains<\u002Fh3>\n      <sc-for list=\"{{ domainCards }}\" as=\"d\" hint-placeholder-count=\"4\">\n        <div style=\"background:var(--mv-surface-card);border-radius:12px;box-shadow:0 2px 6px rgb(9 29 32 / .07);padding:13px 14px;display:flex;gap:11px;align-items:flex-start\">\n          <span style=\"flex:none;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--mv-white);background:{{ d.color }}\">{{ d.id }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:3px;min-width:0\">\n            <span style=\"font-size:14.5px;font-weight:700;color:var(--mv-text-heading);text-wrap:pretty\">{{ d.name }}<\u002Fspan>\n            <span style=\"font-size:13px;line-height:1.5;color:var(--mv-text-body-alt);text-wrap:pretty\">{{ d.covers }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <h3 style=\"margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Who’s facilitating<\u002Fh3>\n      <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);overflow:hidden\">\n        <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"padding:13px 14px;border-bottom:1px solid var(--mv-border-subtle);display:flex;gap:12px;align-items:center\">\n            <span aria-hidden=\"true\" style=\"flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--mv-white);background:{{ p.color }}\">{{ p.initials }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n              <span style=\"font-size:15px;font-weight:700;color:var(--mv-text-heading)\">{{ p.name }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:var(--mv-text-muted)\">{{ p.role }}<\u002Fspan>\n              <span style=\"font-size:12.5px;line-height:1.45;color:var(--mv-text-body-alt);text-wrap:pretty\">{{ p.labs }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);padding:15px;display:flex;flex-direction:column;gap:9px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Industry panel · 9:55 – 10:35 a.m.<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--mv-text-body);text-wrap:pretty\">Two or three voices from outside education on how AI is actually being used in their work — and what that means for what students need to know and be able to do.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n          <sc-for list=\"{{ panelSectors }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <span style=\"font-size:12px;font-weight:600;padding:4px 9px;border-radius:9999px;background:var(--mv-surface-shade);color:var(--mv-deep-teal)\">{{ s }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:var(--mv-surface-warm);border-left:4px solid var(--mv-orange-a11y);border-radius:8px;padding:11px\">\n          <span style=\"font-size:13px;line-height:1.5;color:var(--mv-text-body)\">Panelists for this region are being confirmed. Names and bios appear here once they’re locked.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Questions, answered<\u002Fh3>\n      <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);overflow:hidden\">\n        <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"9\">\n          <div style=\"border-bottom:1px solid var(--mv-border-subtle)\">\n            <button type=\"button\" sc-camel-on-click=\"{{ q.tog irst and last name\" style=\"min-height:44px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 11px;font-size:14px;color:var(--mv-text-body);background:var(--mv-white)\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px\">\n          <label for=\"bts-district2\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">District or organization<\u002Flabel>\n          <input id=\"bts-district2\" type=\"text\" value=\"{{ profileDistrict }}\" sc-camel-on-change=\"{{ onDistrict }}\" placeholder=\"Your district\" style=\"min-height:44px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 11px;font-size:14px;color:var(--mv-text-body);background:var(--mv-white)\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px\">\n          <label for=\"bts-role2\" style=\"font-size:12.5px;font-weight:700;color:var(--mv-text-heading)\">Role<\u002Flabel>\n          <input id=\"bts-role2\" type=\"text\" value=\"{{ profileRole }}\" sc-camel-on-change=\"{{ onRole }}\" placeholder=\"Your role\" style=\"min-height:44px;border-radius:6px;border:1px solid var(--mv-border-subtle);padding:0 11px;font-size:14px;color:var(--mv-text-body);background:var(--mv-white)\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--mv-surface-card);border-radius:16px;box-shadow:0 2px 6px rgb(9 29 32 / .08);padding:15px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mv-dark-teal)\">Keep this on your home screen<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--mv-text-body);text-wrap:pretty\">Add the app to your home screen and it opens full-screen, works without a signal, and keeps your notes between sessions.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:7px\">\n          <sc-for list=\"{{ instal
