"none\" stroke=\"var(--mv-light-teal)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex:none\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"><\u002Fpath><\u002Fsvg>\n                <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                  <span style=\"font-size:14px;font-weight:700;color:var(--mv-text-heading)\">{{ r.label }}<\u002Fspan>\n                  <span style=\"font-size:12.5px;color:var(--mv-text-muted)\">{{ r.state }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:none;border-top:1px solid var(--mv-border-subtle);padding:12px 18px calc(env(safe-area-inset-bottom, 0px) + 16px);display:flex;gap:9px;background:var(--mv-white)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ sheetToggle }}\" style=\"flex:1;min-height:50px;border-radius:9999px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:{{ sheetBtnBg }};color:{{ sheetBtnFg }}\">{{ sheetBtnLabel }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ sheetNotes }}\" style=\"flex:none;min-height:50px;border-radius:9999px;cursor:pointer;padding:0 18px;font-size:15px;font-weight:700;border:2px solid var(--mv-border-strong);background:var(--mv-white);color:var(--mv-text-heading)\" style-hover=\"background:var(--mv-surface-sunken)\">Notes<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"status\" aria-live=\"polite\" style=\"position:absolute;left:18px;right:18px;bottom:104px;z-index:90;background:var(--mv-surface-darkest);color:var(--mv-white);border-radius:12px;padding:13px 15px;font-size:14px;font-weight:600;box-shadow:0 10px 24px rgb(9 29 32 / .3);animation:btsrise 200ms cubic-bezier(.2,0,.2,1)\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;setup&quot;,&quot;day&quot;,&quot;schedule&quot;,&quot;labs&quot;,&quot;notebook&quot;,&quot;info&quot;],&quot;default&quot;:&quot;setup&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;previewTime&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:790,&quot;min&quot;:500,&quot;max&quot;:980,&quot;step&quot;:5,&quot;unit&quot;:&quot;min&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;useRealClock&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;highContrast&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Accessibility&quot;},&quot;defaultRegion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;north&quot;,&quot;west&quot;,&quot;southeast&quot;],&quot;default&quot;:&quot;north&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nconst DOMAINS = [\n  { id: 'A', name: 'Policy & Oversight', color: '#093c44', covers: 'AI policy iterations, early indicators of impact, and data privacy and safety guidelines.' },\n  { id: 'B', name: 'Curriculum & Instruction', color: '#115e6e', covers: 'Unit redesign, authentic assessment, and AI-augmented feedback.' },\n  { id: 'C', name: 'Operations & Advanced Integration', color: '#2f8d98', covers: 'Workflow development, design thinking for systems, and scaling with internal trainers.' },\n  { id: 'D', name: 'Students & Community', color: '#a84c2a', covers: 'Student voice, family and community engagement, and AI literacy.' },\n];\n\nconst LABS = [\n  { id: 'A1', domain: 'A', block: 1, title: 'Safety, Privacy & Governance', lead: 'Ken', speaker: 'Kristen Kayser',\n    desc: 'Addressing concerns for FOIA, FERPA and risk through policy, guidance and clear expectations. Highlights case studies from across Michigan and current guidance from MDE.' },\n  { id: 'A2', domain: 'A', block: 2, title: 'Your Policy, One Year Later: From v1 to v2', lead: 'Annie & Karle', speaker: 'Amy Dirlam',\n    desc: 'What year one of implementation revealed about first-generation AI policies, and a self-assessment to prioritize the next revision. Also addresses growing skepticism and shifting public sentiment.',\n    bring: 'Your current AI policy or acceptable use policy, v1.' },\n  { id: 'A3', domain: 'A', block: 3, title: 'Pilot with Purpose: Scaling AI That Works', lead: 'Al', speaker: 'Samuela Mouzaoir, Ingham ISD',\n    desc: 'Design an actionable AI pilot that measures adoption, efficacy and equity to build the evidence needed to determine whether and how a tool should scale. You will also develop a plan for widespread adoption that continuously monitors, calibrates and improves implementation and outcomes over time.' },\n  { id: 'B1', domain: 'B', block: 1, title: 'Unit Redesign for the AI Era', lead: 'Annie & Mike', speaker: '', tools: 'Gemini, SchoolAI',\n    desc: 'Rebuild a unit for the AI era by deciding, moment by moment, when, where, how and why AI belongs in the learning process — and when it should not. You model the redesign live and leave with a modernized, AI-adapted unit ready for immediate classroom use.',\n    bring: 'A unit you already teach, in whatever form it lives today.' },\n  { id: 'B2', domain: 'B', block: 2, title: 'Rethinking Authentic Assessment', lead: 'Mike', speaker: '',\n    desc: 'Clarify assessment purpose and targets, then apply three redesign moves — process visibility, oral defense and applied transfer — to a real assessment. Walk away with a student-centered, equitable, AI-resilient assessment ready to use.',\n    bring: 'One real assessment you are not fully happy with.' },\n  { id: 'B3', domain: 'B', block: 3, title: 'AI-Augmented Formative Feedback', lead: 'Mike', speaker: '',\n    desc: 'Deliver high-quality, standards-aligned formative feedback at scale without sacrificing student relationships. Explore AI workflows that generate timely, specific, evidence-based guidance rather than generic slop, and walk away with customized prompt templates.' },\n  { id: 'C1', domain: 'C', block: 1, title: 'From Prompts to Processes: Designing AI-Powered Workflows', lead: 'Al', speaker: '',\n    desc: 'Rethink your most persistent workflow challenges by exploring how chat, skills, agents and loops work together. Using the delegate, direct and evaluate framework, you leave with a detailed blueprint for an AI-powered workflow you can start building and testing in your district.' },\n  { id: 'C2', domain: 'C', block: 2, title: 'Design Thinking for Operations and Systems', lead: 'Ken', speaker: '',\n    desc: 'Bring an operational challenge and use a facilitated design thinking process to leave with a scoped, testable next step.',\n    bring: 'One operational challenge that keeps coming back.' },\n  { id: 'C3', domain: 'C', block: 3, title: 'Train-the-Trainer & Building Capacity', lead: 'Karle', speaker: '',\n    desc: 'Build an internal network of AI trainers who can support consistent, sustainable learning across your district. Explore practical structures for preparing facilitators, sharing resources and responding to emerging capabilities, and leave with a plan for expanding expertise.' },\n  { id: 'D1', domain: 'D', block: 1, title: 'Student Voice in AI Decision-Making', lead: 'Karle', speaker: '',\n    desc: 'Move beyond asking students for feedback by building meaningful student voice into AI task forces, guidance and implementation decisions. Hear real-world examples from districts, explore practical structures for student participation, and leave with a plan for involving students as partners.' },\n  { id: 'D2', domain: 'D', block: 2, title: 'Shaping AI Use Together: Families, Schools and Communities', lead: 'Al', speaker: 'Jonathan Tobar, Livingston ESA',\n    desc: 'Develop strategies for helping families and community partners understand district AI policies and practices that support student learning, prioritize safety and ethics, and strengthen student–teacher trust. Explore how transparent communication and community partnerships prepare students to use AI critically and responsibly.' },\n  { id: 'D3', domain: 'D', block: 3, title: 'Student AI Literacy: Beyond the Rules', lead: 'Annie', speaker: '',\n    desc: 'Moving students from rule-followers to capable, critical users — what a district-wide student AI literacy progression looks like across grade bands.' },\n];\n\nconst EVENTS = {\n  north: { region: 'Northern Michigan', short: 'Oct 26, 2026', date: 'Monday, October 26, 2026', venue: 'Treetops Resort', city: 'Gaylord, Michigan' },\n  west: { region: 'West Michigan', short: 'Nov 18, 2026', date: 'Wednesday, November 18, 2026', venue: 'Kalamazoo Valley Community College', city: 'Kalamazoo, Michigan' },\n  southeast: { region: 'Southeast Michigan', short: 'Spring 2027', date: 'Spring 2027, date to be confirmed', venue: 'Venue to be confirmed', city: 'Southeast Michigan' },\n};\n\nconst BLOCK_TIME = { 1: '10:55 – 11:55 a.m.', 2: '12:55 – 1:55 p.m.', 3: '2:05 – 3:05 p.m.' };\n\nconst DAY = [\n  { t: '8:30 – 9:00 a.m.', m: 30, s: 510, e: 540, title: 'Arrival', detail: 'Check-in, coffee, team tables open.' },\n  { t: '9:00 – 10:45 a.m.', m: 105, s: 540, e: 645, title: 'Opening Exchange', detail: 'A working session, not a sit-and-get. You leave it with a problem statement and a coverage plan.', steps: ['MV open — where districts actually stand (15 min)', 'Team self-assessment on the wall map (10 min)', 'Idea exchange — walk the wall, find your match (20 min)', 'Industry panel (40 min)', 'Team huddle — problem statement and coverage plan (15 min)', 'Pattern-back — divide and conquer (5 min)'] },\n  { t: '10:45 – 10:55 a.m.', m: 10, s: 645, e: 655, title: 'Break', detail: 'Find your first lab room.' },\n  { block: 1, t: '10:55 – 11:55 a.m.', m: 60, s: 655, e: 715, title: 'Lab Block 1' },\n  { t: '11:55 a.m. – 12:55 p.m.', m: 60, s: 715, e: 775, title: 'Lunch', detail: 'Provided. Sit with a district you have not met.' },\n  { block: 2, t: '12:55 – 1:55 p.m.', m: 60, s: 775, e: 835, title: 'Lab Block 2' },\n  { t: '1:55 – 2:05 p.m.', m: 10, s: 835, e: 845, title: 'Break', detail: 'Refreshments and transition.' },\n  { block: 3, t: '2:05 – 3:05 p.m.', m: 60, s: 845, e: 905, title: 'Lab Block 3' },\n  { t: '3:15 – 3:30 p.m.', m: 15, s: 915, e: 930, title: 'Team Reconnect', detail: 'Back with your district team. Each person shares their walk-away.' },\n  { t: '3:30 – 4:00 p.m.', m: 30, s: 930, e: 960, title: 'Closing Synthesis', detail: 'Build your 30/60/90 commitments, then the network close and exit survey.' },\n];\n\nconst PEOPLE = [\n  { name: 'Annie', labs: 'B1 Unit Redesign · A2 Policy v1 to v2 · D3 Student AI Literacy', color: '#093c44' },\n  { name: 'Mike', labs: 'B1 Unit Redesign · B2 Authentic Assessment · B3 AI-Augmented Feedback', color: '#115e6e' },\n  { name: 'Karle', labs: 'D1 Student Voice · A2 Policy v1 to v2 · C3 Train-the-Trainer', color: '#2f8d98' },\n  { name: 'Al', labs: 'C1 Prompts to Processes · D2 Families and Communities · A3 Pilot with Purpose', color: '#a84c2a' },\n  { name: 'Ken', labs: 'A1 Safety, Privacy & Governance · C2 Design Thinking for Operations', color: '#093c44' },\n];\n\nconst PANEL_SECTORS = ['Arts', 'Communication', 'Business & marketing', 'Technology', 'Engineering & manufacturing', 'Health sciences', 'Human services', 'Natural resources & agriculture'];\n\nconst FAQS = [\n  { q: 'What exactly is a Lab?', a: 'A working session, not a presentation. Labs are designed to address real challenges through experimentation and collective problem-solving, and you should expect to produce something you can use on Monday.' },\n  { q: 'Do I have to stay in one domain all day?', a: 'No. All four domains run in every block, so you can follow one thread or deliberately spread out. If you came with a district team, the point of the opening huddle is to divide and conquer across the four domains.' },\n  { q: 'What should I bring?', a: 'A device you can work on, and real material from your district: a unit, an assessment, your current AI policy, or an operational problem that keeps coming back. Several labs are built around the artifact you walk in with.' },\n  { q: 'What happens in the two-hour opening?', a: 'Your team plots itself on a four-domain wall map, walks the wall to find one district ahead of you and one you can help, hears the industry panel, then huddles to write a problem statement and assign who covers which lab.' },\n  { q: 'Is lunch provided?', a: 'Yes, lunch and refreshments are included for both registration tiers. Menu and dietary accommodations are confirmed with the venue closer to the event.' },\n  { q: 'Are my notes private?', a: 'Yes. Everything you type here is stored on this device only. Nothing is uploaded, and Michigan Virtual cannot see it. Use Export my notes before you hand the device back or clear your browser.' },\n  { q: 'Will slides and resources be shared afterwards?', a: 'Yes. Post-event resources are part of both registration tiers. Links appear on each lab page once facilitators post them.' },\n  { q: 'How is this different from the AI Summit?', a: 'The Summit was broadcast-style. This is a smaller, team-based working day — roughly 100 to 150 people — for districts that already have guidance in place and need to know what to do next.' },\n  { q: 'What is the Innovators\\u2019 Retreat?', a: 'A capstone exchange in spring 2027 for teams ready to move from implementation into innovation. It is separate from the symposium series and invitation only.' },\n  { q: 'Who do I find if something goes wrong today?', a: 'Michigan Virtual staff are at the check-in table all day. On-site contact details are confirmed before the event and appear here.' },\n];\n\nconst ICONS = {\n  day: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><polygon points=\"16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9\"><\u002Fpolygon><\u002Fsvg>',\n  schedule: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"><\u002Frect><path d=\"M16 2v4\"><\u002Fpath><path d=\"M8 2v4\"><\u002Fpath><path d=\"M3 10h18\"><\u002Fpath><\u002Fsvg>',\n  labs: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg>',\n  notebook: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"><\u002Fpath><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"><\u002Fpath><path d=\"M9 7h7\"><\u002Fpath><path d=\"M9 11h7\"><\u002Fpath><\u002Fsvg>',\n  info: '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-5\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg>',\n};\n\nconst STORE = 'bts.participant.v1';\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'setup',\n    tab: 'day',\n    sheet: null,\n    filter: 'all',\n    openFaq: null,\n    toast: '',\n    profile: { name: '', district: '', role: '' },\n    region: 'north',\n    plan: { 1: null, 2: null, 3: null },\n    notes: {},\n    reflection: '',\n    commit: { d30: {}, d60: {}, d90: {} },\n  };\n\n  componentDidMount() {\n    let saved = null;\n    try { saved = JSON.parse(window.localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }\n    const start = this.props.startScreen || 'setup';\n    const next = {};\n    if (saved && typeof saved === 'object') {\n      ['profile', 'region', 'plan', 'notes', 'reflection', 'commit'].forEach(k => { if (saved[k] !== undefined) next[k] = saved[k]; });\n      if (saved.profile && saved.profile.name) { next.screen = 'app'; }\n    }\n    if (this.props.defaultRegion && !next.region) next.region = this.props.defaultRegion;\n    if (start !== 'setup') { next.screen = 'app'; next.tab = start; }\n    if (Object.keys(next).length) this.setState(next);\n    try {\n      document.documentElement.setAttribute('data-bts-ready', '1');\n      const boot = document.getElementById('bts-boot');\n      if (boot) setTimeout(() => boot.remove(), 420);\n    } catch (e) { /* no document */ }\n  }\n\n  componentDidUpdate(_p, prev) {\n    const keys = ['profile', 'region', 'plan', 'notes', 'reflection', 'commit'];\n    if (keys.some(k => prev[k] !== this.state[k])) {\n      try {\n        const out = {}; keys.forEach(k => { out[k] = this.state[k]; });\n        window.localStorage.setItem(STORE, JSON.stringify(out));\n      } catch (e) { /* storage unavailable — session only */ }\n    }\n  }\n\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2600);\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  nowMinutes() {\n    if (this.props.useRealClock) { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }\n    const p = this.props.previewTime;\n    return typeof p === 'number' ? p : 630;\n  }\n\n  setPlan(block, labId) {\n    this.setState(s => {\n      const plan = Object.assign({}, s.plan);\n      plan[block] = plan[block] === labId ? null : labId;\n      return { plan };\n    });\n  }\n\n  setNote(labId, field, value) {\n    this.setState(s => {\n      const notes = Object.assign({}, s.notes);\n      notes[labId] = Object.assign({}, notes[labId], { [field]: value });\n      return { notes };\n    });\n  }\n\n  setCommit(key, field, value) {\n    this.setState(s => {\n      const commit = Object.assign({}, s.commit);\n      commit[key] = Object.assign({}, commit[key], { [field]: value });\n      return { commit };\n    });\n  }\n\n  exportNotes = () => {\n    const s = this.state;\n    const ev = EVENTS[s.region];\n    const L = [];\n    L.push('BEYOND THE SUMMIT — AI IMPLEMENTERS\\u2019 SYMPOSIUM');\n    L.push(ev.region + ' · ' + ev.date + ' · ' + ev.venue);\n    L.push('');\n    L.push('Participant: ' + (s.profile.name || '—'));\n    L.push('District: ' + (s.profile.district || '—'));\n    if (s.profile.role) L.push('Role: ' + s.profile.role);\n    L.push('');\n    L.push('— LAB NOTES —');\n    [1, 2, 3].forEach(b => {\n      const id = s.plan[b];\n      const lab = LABS.find(l => l.id === id);\n      L.push('');\n      L.push('Block ' + b + ' (' + BLOCK_TIME[b] + ')');\n      if (!lab) { L.push('  No lab selected.'); return; }\n      const n = s.notes[id] || {};\n      L.push('  ' + lab.id + ' ' + lab.title + ' — ' + lab.lead);\n      L.push('  Consume: ' + (n.consume || '—'));\n      L.push('  Construct: ' + (n.construct || '—'));\n      L.push('  Communicate: ' + (n.communicate || '—'));\n      L.push('  Key move: ' + (n.keyMove || '—'));\n    });\n    L.push('');\n    L.push('— REFLECTIONS —');\n    L.push(s.reflection || '—');\n    L.push('');\n    L.push('— 30 / 60 / 90 COMMITMENTS —');\n    [['d30', '30 days'], ['d60', '60 days'], ['d90', '90 days']].forEach(([k, label]) => {\n      const c = s.commit[k] || {};\n      L.push('');\n      L.push(label);\n      L.push('  Action: ' + (c.action || '—'));\n      L.push('  Evidence: ' + (c.evidence || '—'));\n      L.push('  Lead: ' + (c.lead || '—') + '   Reconvene: ' + (c.date || '—'));\n    });\n    const blob = new Blob([L.join('\\n')], { type: 'text/plain;charset=utf-8' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'beyond-the-summit-notebook.txt';\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 2000);\n    this.flash('Notebook downloaded to your device.');\n  };\n\n  renderVals() {\n    const s = this.state;\n    const hc = !!this.props.highContrast;\n    const actBg = hc ? '#a84c2a' : '#f7941e';\n    const actFg = hc ? '#ffffff' : '#091d20';\n    const ev = EVENTS[s.region] || EVENTS.north;\n    const dom = id => DOMAINS.find(d => d.id === id);\n    const labById = id => LABS.find(l => l.id === id);\n    const now = this.nowMinutes();\n\n    const titles = { day: 'Your day', schedule: 'Full schedule', labs: 'All twelve labs', notebook: 'Your notebook', info: 'Good to know' };\n    const first = (s.profile.name || '').trim().split(/\\s+/)[0] || '';\n    const initials = (s.profile.name || '').trim().split(/\\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'BTS';\n\n    // Up next\n    let upLabel = 'Up next', upTitle = '', upDetail = '', upTime = '', upRoom = 'Room to be confirmed';\n    const current = DAY.find(d => now >= d.s && now < d.e);\n    const upcoming = DAY.find(d => d.s > now);\n    const pick = current || upcoming || DAY[DAY.length - 1];\n    if (current) upLabel = 'Happening now';\n    else if (!upcoming) upLabel = 'That’s a wrap';\n    if (pick.block) {\n      const lab = labById(s.plan[pick.block]);\n      upTitle = lab ? lab.title : 'Lab Block ' + pick.block + ' — pick a lab';\n      upDetail = lab ? (dom(lab.domain).name + ' · ' + lab.lead) : 'All four domains are running. Choose one from your day or the schedule.';\n    } else {\n      upTitle = pick.title;\n      upDetail = pick.detail || '';\n      upRoom = pick.title === 'Lunch' ? 'Dining area' : 'Main room';\n    }\n    upTime = pick.t;\n\n    // Plan blocks\n    const planBlocks = [1, 2, 3].map(n => {\n      const lab = labById(s.plan[n]);\n      const options = LABS.filter(l => l.block === n).map(l => ({\n        id: l.id, color: dom(l.domain).color, domainName: dom(l.domain).name.split(' ')[0],\n        pick: () => this.setPlan(n, l.id),\n      }));\n      return {\n        n, time: BLOCK_TIME[n], hasLab: !!lab, empty: !lab, options,\n        labId: lab ? lab.id : '', labTitle: lab ? lab.title : '',\n        labMeta: lab ? (dom(lab.domain).name + ' · ' + lab.lead) : '',\n        labRoom: 'Room to be confirmed',\n        color: lab ? dom(lab.domain).color : '#093c44',\n        open: () => this.setState({ sheet: lab ? lab.id : null }),\n      };\n    });\n\n    // Schedule\n    const scheduleRows = DAY.map(d => {\n      const live = now >= d.s && now < d.e;\n      const options = d.block ? LABS.filter(l => l.block === d.block).map(l => {\n        const checked = s.plan[d.block] === l.id;\n        return {\n          id: l.id, title: l.title, lead: l.lead, checked,\n          domainName: dom(l.domain).name, color: dom(l.domain).color,\n          dot: checked ? dom(l.domain).color : 'transparent',\n          rowBg: checked ? '#f3fafc' : '#ffffff',\n          moreLabel: 'Details for ' + l.id + ' ' + l.title,\n          pick: () => this.setPlan(d.block, l.id),\n          open: () => this.setState({ sheet: l.id }),\n        };\n      }) : [];\n      return {\n        time: d.t, mins: d.m + ' min', title: d.title, detail: d.detail || '',\n        plain: !d.block, isBlock: !!d.block, options,\n        steps: d.steps || [], hasSteps: !!d.steps,\n        dot: live ? '#b5cd34' : (d.block ? '#2f8d98' : '#c7dee0'),\n      };\n    });\n\n    // Labs list\n    const filters = [{ id: 'all', label: 'All 12' }].concat(DOMAINS.map(d => ({ id: d.id, label: d.id + ' · ' + d.name.split(' ')[0] })));\n    const filterVals = filters.map(f => {\n      const on = s.filter === f.id;\n      return {\n        label: f.label, on,\n        bg: on ? '#093c44' : '#ffffff', fg: on ? '#ffffff' : '#093c44',\n        border: on ? '#093c44' : '#c7dee0',\n        pick: () => this.setState({ filter: f.id }),\n      };\n    });\n    const labList = LABS.filter(l => s.filter === 'all' || l.domain === s.filter).map(l => ({\n      id: l.id, title: l.title, color: dom(l.domain).color, domainName: dom(l.domain).name,\n      teaser: l.desc.length > 125 ? l.desc.slice(0, 122).replace(/[\\s,;.]+$/, '') + '…' : l.desc,\n      blockLabel: 'Block ' + l.block + ' · ' + BLOCK_TIME[l.block],\n      lead: l.lead, inPlan: s.plan[l.block] === l.id,\n      open: () => this.setState({ sheet: l.id }),\n    }));\n\n    // Sheet\n    const sheetLab = s.sheet ? labById(s.sheet) : null;\n    const sheetFacts = [];\n    if (sheetLab) {\n      sheetFacts.push({ k: 'When', v: 'Block ' + sheetLab.block + ' · ' + BLOCK_TIME[sheetLab.block] });\n      sheetFacts.push({ k: 'Room', v: 'To be confirmed' });\n      sheetFacts.push({ k: 'Facilitator', v: sheetLab.lead + ', Michigan Virtual AI Strategist' });\n      if (sheetLab.speaker) sheetFacts.push({ k: 'With', v: sheetLab.speaker });\n      if (sheetLab.tools) sheetFacts.push({ k: 'Tools', v: sheetLab.tools });\n    }\n    const inPlan = sheetLab && s.plan[sheetLab.block] === sheetLab.id;\n\n    // Notebook\n    const noteCards = [1, 2, 3].map(n => {\n      const lab = labById(s.plan[n]);\n      const id = lab ? lab.id : '';\n      const nv = (lab && s.notes[id]) || {};\n      return {\n        n, time: BLOCK_TIME[n], hasLab: !!lab, empty: !lab,\n        title: lab ? (lab.id + ' ' + lab.title) : 'No lab picked yet',\n        headBg: lab ? '#f3fafc' : '#ffffff',\n        idConsume: 'nb-' + n + '-consume', idConstruct: 'nb-' + n + '-construct',\n        idCommunicate: 'nb-' + n + '-communicate', idMove: 'nb-' + n + '-move',\n        consume: nv.consume || '', construct: nv.construct || '',\n        communicate: nv.communicate || '', keyMove: nv.keyMove || '',\n        onConsume: e => this.setNote(id, 'consume', e.target.value),\n        onConstruct: e => this.setNote(id, 'construct', e.target.value),\n        onCommunicate: e => this.setNote(id, 'communicate', e.target.value),\n        onMove: e => this.setNote(id, 'keyMove', e.target.value),\n        goPick: () => this.setState({ tab: 'schedule' }),\n      };\n    });\n\n    const commitMeta = [\n      { key: 'd30', label: '30 days', sub: 'The smallest meaningful step', actionLabel: 'We will begin…', actionHint: 'One thing you can start without permission', evidenceLabel: 'So that students and staff experience…', evidenceHint: 'The change someone would notice' },\n      { key: 'd60', label: '60 days', sub: 'System and workflow adjustments', actionLabel: 'We will examine, refine or build…', actionHint: 'The structure that has to shift', evidenceLabel: 'Evidence we will look for…', evidenceHint: 'What tells you it is working' },\n      { key: 'd90', label: '90 days', sub: 'What you report back to the network', actionLabel: 'We will be able to show…', actionHint: 'The result worth sharing', evidenceLabel: 'How we will share it…', evidenceHint: 'Board, staff meeting, network update' },\n    ];\n    const commitCards = commitMeta.map(m => {\n      const c = s.commit[m.key] || {};\n      return Object.assign({}, m, {\n        idAction: 'cm-' + m.key + '-a', idEvidence: 'cm-' + m.key + '-e',\n        idLead: 'cm-' + m.key + '-l', idDate: 'cm-' + m.key + '-d',\n        action: c.action || '', evidence: c.evidence || '', lead: c.lead || '', date: c.date || '',\n        onAction: e => this.setCommit(m.key, 'action', e.target.value),\n        onEvidence: e => this.setCommit(m.key, 'evidence', e.target.value),\n        onLead: e => this.setCommit(m.key, 'lead', e.target.value),\n        onDate: e => this.setCommit(m.key, 'date', e.target.value),\n      });\n    });\n\n    const tabs = [\n      { id: 'day', label: 'Your day' }, { id: 'schedule', label: 'Schedule' }, { id: 'labs', label: 'Labs' },\n      { id: 'notebook', label: 'Notebook' }, { id: 'info', label: 'Info' },\n    ].map(t => {\n      const on = s.tab === t.id;\n      return {\n        label: t.label, on, icon: { __html: ICONS[t.id] },\n        color: on ? '#093c44' : '#6d6e71',\n        rule: on ? '#b5cd34' : 'transparent',\n        go: () => this.setState({ tab: t.id, sheet: null }),\n      };\n    });\n\n    const regionOptions = Object.keys(EVENTS).map(k => {\n      const e = EVENTS[k]; const on = s.region === k;\n      return {\n        region: e.region, line: e.date + ' · ' + e.venue, checked: on,\n        border: on ? '#115e6e' : '#c7dee0', bg: on ? '#f3fafc' : '#ffffff',\n        dot: on ? '#a84c2a' : 'transparent',\n        pick: () => this.setState({ region: k }),\n      };\n    });\n\n    const greetHour = now;\n    const greetWord = greetHour < 720 ? 'Good morning' : (greetHour < 1020 ? 'Good afternoon' : 'Good evening');\n    const picked = [1, 2, 3].filter(n => s.plan[n]).length;\n\n    return {\n      actBg, actFg, contrastKey: hc ? 'high' : 'standard',\n      installSteps: [\n        { k: 'iPhone', v: 'Tap the Share button in Safari, then Add to Home Screen.' },\n        { k: 'Android', v: 'Tap the three-dot menu in Chrome, then Install app or Add to Home screen.' },\n        { k: 'Laptop', v: 'Bookmark the page, or use Install from the address bar in Chrome or Edge.' },\n      ],\n      isSetup: s.screen === 'setup', isApp: s.screen === 'app',\n      tabDay: s.screen === 'app' && s.tab === 'day',\n      tabSchedule: s.screen === 'app' && s.tab === 'schedule',\n      tabLabs: s.screen === 'app' && s.tab === 'labs',\n      tabNotebook: s.screen === 'app' && s.tab === 'notebook',\n      tabInfo: s.screen === 'app' && s.tab === 'info',\n      screenTitle: titles[s.tab] || 'Your day',\n      initials,\n      eventShort: ev.short, eventRegion: ev.region, eventDate: ev.date, eventVenue: ev.venue, eventCity: ev.city,\n      wifiNetwork: 'To be confirmed', wifiPassword: 'To be confirmed',\n      venueFacts: [\n        { k: 'Arrival', v: 'Doors and check-in open at 8:30 a.m. Coffee and team tables are ready.' },\n        { k: 'Parking', v: 'To be confirmed with the venue.' },\n        { k: 'Rooms', v: 'Lab room assignments are posted at check-in and appear on each lab page.' },\n        { k: 'Lunch', v: 'Provided. Dietary accommodations to be confirmed.' },\n      ],\n      greeting: first ? (greetWord + ', ' + first + '.') : (greetWord + '.'),\n      greetingSub: s.profile.district ? ('You and ' + s.profile.district + ' have a full day ahead. Here is your plan.') : 'Here is your plan for the day.',\n      upNextLabel: upLabel, upNextTitle: upTitle, upNextDetail: upDetail, upNextTime: upTime, upNextRoom: upRoom,\n      pickedCount: picked,\n      planBlocks, scheduleRows, labList, noteCards, commitCards, tabs, regionOptions,\n      filters: filterVals,\n      plenaryItems: DAY.filter(d => !d.block && d.title !== 'Break').map(d => ({ time: d.t.replace(/\\s/g, ' '), title: d.title, detail: d.detail || '' })),\n      domainCards: DOMAINS,\n      people: PEOPLE.map(p => ({ name: p.name, role: 'Michigan Virtual AI Strategist', labs: p.labs, initials: p.name[0], color: p.color })),\n      panelSectors: PANEL_SECTORS,\n      faqs: FAQS.map((f, i) => ({\n        q: f.q, a: f.a, open: s.openFaq === i,\n        rotate: s.openFaq === i ? 'rotate(180deg)' : 'rotate(0deg)',\n        toggle: () => this.setState({ openFaq: s.openFaq === i ? null : i }),\n      })),\n      profileName: s.profile.name, profileDistrict: s.profile.district, profileRole: s.profile.role,\n      onName: e => { const v = e.target.value; this.setState(st => ({ profile: Object.assign({}, st.profile, { name: v }) })); },\n      onDistrict: e => { const v = e.target.value; this.setState(st => ({ profile: Object.assign({}, st.profile, { district: v }) })); },\n      onRole: e => { const v = e.target.value; this.setState(st => ({ profile: Object.assign({}, st.profile, { role: v }) })); },\n      startApp: () => this.setState({ screen: 'app', tab: 'day' }),\n      switchRegion: () => this.setState({ screen: 'setup' }),\n      goProfile: () => this.setState({ tab: 'info', sheet: null }),\n      goWifi: () => this.setState({ tab: 'info' }),\n      goVenue: () => this.setState({ tab: 'info' }),\n      goNotebook: () => this.setState({ tab: 'notebook' }),\n      goCommit: () => this.setState({ tab: 'notebook' }),\n      reflection: s.reflection,\n      onReflection: e => { const v = e.target.value; this.setState({ reflection: v }); },\n      exportNotes: this.exportNotes,\n      sheetOpen: !!sheetLab,\n      sheetId: sheetLab ? sheetLab.id : '',\n      sheetTitle: sheetLab ? sheetLab.title : '',\n      sheetAria: sheetLab ? (sheetLab.id + ' ' + sheetLab.title) : '',\n      sheetDomain: sheetLab ? dom(sheetLab.domain).name : '',\n      sheetColor: sheetLab ? dom(sheetLab.domain).color : '#093c44',\n      sheetDesc: sheetLab ? sheetLab.desc : '',\n      sheetHasBring: !!(sheetLab && sheetLab.bring), sheetBring: sheetLab ? (sheetLab.bring || '') : '',\n      sheetFacts,\n      sheetResources: [\n        { label: 'Slide deck', state: 'Posted by the facilitator' },\n        { label: 'Working template', state: 'Posted by the facilitator' },\n        { label: 'Shared resource folder', state: 'Available after the event' },\n      ],\n      sheetBtnLabel: inPlan ? 'Remove from my plan' : 'Add to my plan',\n      sheetBtnBg: inPlan ? '#093c44' : actBg,\n      sheetBtnFg: inPlan ? '#ffffff' : actFg,\n      sheetToggle: () => {\n        if (!sheetLab) return;\n        this.setPlan(sheetLab.block, sheetLab.id);\n        this.flash(inPlan ? 'Removed from your plan.' : (sheetLab.id + ' added to Block ' + sheetLab.block + '.'));\n      },\n      sheetNotes: () => this.setState({ sheet: null, tab: 'notebook' }),\n      closeSheet: () => this.setState({ sheet: null }),\n      toastOn: !!s.toast, toast: s.toast,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
